<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守护我们唯一的家园</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Google Fonts 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2560&auto=format&fit=crop');
            --primary-green: #2E7D32;
            --light-green-bg: rgba(232, 245, 233, 0.85);
            --text-dark: #1B5E20;
            --text-light: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-image: var(--bg-image);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 页面主标题 */
        .main-title {
            font-size: 3rem;
            font-weight: 600;
            color: var(--text-light);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            margin-top: 2rem;
            margin-bottom: 1rem;
            animation: fadeInDown 1s ease-out;
        }
        
        /* 搜索容器 */
        .search-container {
            width: 100%;
            max-width: 550px;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
        }
        
        .search-box {
            width: 100%;
            padding: 16px 22px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px var(--shadow-color);
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 1);
        }
        
        /* 链接总容器 */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 链接分类区域 */
        .link-section {
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px var(--shadow-color);
            animation: fadeIn 1.5s ease-out;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-green);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(46, 125, 50, 0.3);
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 10px;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
        }

        /* 链接卡片 */
        .link-item {
            background-color: var(--light-green-bg);
            border-radius: 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 2px 5px var(--shadow-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }
        
        .link-item:hover {
            background-color: #ffffff;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }
        
        .link-item a {
            text-decoration: none;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .link-icon {
            font-size: 28px;
            margin-bottom: 12px;
            color: var(--primary-green);
            transition: transform 0.3s ease;
        }

        .link-item:hover .link-icon {
            transform: scale(1.2);
        }
        
        .link-text {
            font-size: 14px;
            text-align: center;
            font-weight: 600;
        }

        /* 底部版权 */
        .footer-marker {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 0;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }

        .footer-marker a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-marker a:hover {
            color: #fff;
        }        

        /* 动画效果 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1 class="main-title">守护我们唯一的家园</h1>

    <div class="search-container">
        <form action="https://www.google.com/search" method="get" target="_blank">
            <input class="search-box" type="text" name="q" placeholder="探索可持续发展的未来...">
        </form>
    </div>
    
    <div class="container">
        <!-- 分类一: 学习与发现 -->
        <section class="link-section">
            <h2 class="section-title"><i class="fa-solid fa-leaf"></i>学习与发现</h2>
            <div class="link-grid">
                <div class="link-item">
                    <a href="https://www.nationalgeographic.com/" target="_blank">
                        <i class="link-icon fa-solid fa-globe-americas"></i>
                        <span class="link-text">国家地理</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.worldwildlife.org/" target="_blank">
                        <i class="link-icon fa-solid fa-paw"></i>
                        <span class="link-text">世界自然基金会</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://climate.nasa.gov/" target="_blank">
                        <i class="link-icon fa-solid fa-satellite-dish"></i>
                        <span class="link-text">NASA 气候变化</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.khanacademy.org/science/biology/ecology" target="_blank">
                        <i class="link-icon fa-solid fa-book-open-reader"></i>
                        <span class="link-text">可汗学院-生态</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.youtube.com/c/bbcearth" target="_blank">
                        <i class="link-icon fa-brands fa-youtube"></i>
                        <span class="link-text">BBC Earth</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://e360.yale.edu/" target="_blank">
                        <i class="link-icon fa-solid fa-tree"></i>
                        <span class="link-text">耶鲁环境360</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- 分类二: 采取行动 -->
        <section class="link-section">
            <h2 class="section-title"><i class="fa-solid fa-hands-holding-child"></i>采取行动</h2>
            <div class="link-grid">
                <div class="link-item">
                    <a href="https://www.greenpeace.org/" target="_blank">
                        <i class="link-icon fa-solid fa-anchor"></i>
                        <span class="link-text">绿色和平</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://theoceancleanup.com/" target="_blank">
                        <i class="link-icon fa-solid fa-water"></i>
                        <span class="link-text">海洋清理计划</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.recyclenow.com/" target="_blank">
                        <i class="link-icon fa-solid fa-recycle"></i>
                        <span class="link-text">立即回收</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.earthday.org/" target="_blank">
                        <i class="link-icon fa-solid fa-calendar-day"></i>
                        <span class="link-text">世界地球日</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://teamtrees.org/" target="_blank">
                        <i class="link-icon fa-solid fa-seedling"></i>
                        <span class="link-text">Team Trees</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.ecosia.org" target="_blank">
                        <i class="link-icon fa-solid fa-magnifying-glass-chart"></i>
                        <span class="link-text">Ecosia 搜索</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- 分类三: 实用工具 (保留部分原链接) -->
        <section class="link-section">
            <h2 class="section-title"><i class="fa-solid fa-screwdriver-wrench"></i>实用工具</h2>
            <div class="link-grid">
                <div class="link-item">
                    <a href="https://github.com" target="_blank">
                        <i class="link-icon fa-brands fa-github"></i>
                        <span class="link-text">GitHub</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://dash.cloudflare.com" target="_blank">
                        <i class="link-icon fa-solid fa-cloud"></i>
                        <span class="link-text">Cloudflare</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://chat.openai.com" target="_blank">
                        <i class="link-icon fa-solid fa-robot"></i>
                        <span class="link-text">ChatGPT</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://www.itdog.cn" target="_blank">
                        <i class="link-icon fa-solid fa-network-wired"></i>
                        <span class="link-text">ITDOG</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://linux.do" target="_blank">
                        <i class="link-icon fa-brands fa-linux"></i>
                        <span class="link-text">Linux.do</span>
                    </a>
                </div>
                <div class="link-item">
                    <a href="https://hoppscotch.io" target="_blank">
                        <i class="link-icon fa-solid fa-paper-plane"></i>
                        <span class="link-text">API 测试</span>
                    </a>
                </div>
            </div>
        </section>
    </div>

    <!-- 底部版权 -->
    <footer class="footer-marker">
        <a href="https://github.com/eooce" target="_blank">"The Earth is what we all have in common."</a>
    </footer>

</body>
</html>
